<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bacnotan BEE-Alert — Forgot Password</title>
  <link rel="stylesheet" href="src/styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">

  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <main class="auth-main">
    <div class="auth-card">

      <header class="auth-card__header">
        <div class="auth-card__logo" aria-hidden="true">🐝</div>
        <h1 class="auth-card__title">Bacnotan BEE-Alert</h1>
        <p class="auth-card__subtitle">Admin Portal</p>
      </header>

      <div class="auth-card__body">

        <!-- Step 1: Enter email -->
        <div id="reset-form-wrapper">
          <h2 class="auth-card__welcome">Reset Password</h2>
          <p class="auth-card__hint">
            Enter your admin email and we'll send you a link to reset your password.
          </p>

          <div id="reset-error" class="form-error form-error--block"
               role="alert" aria-live="polite" hidden></div>

          <form id="reset-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="email-input">Email Address</label>
              <div class="input-wrapper">
                <span class="input-icon" aria-hidden="true">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" stroke-width="2"
                       stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="4" width="20" height="16" rx="2"/>
                    <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                  </svg>
                </span>
                <input
                  class="form-input"
                  type="email"
                  id="email-input"
                  name="email"
                  autocomplete="email"
                  placeholder="admin@example.com"
                  aria-describedby="email-error"
                  aria-required="true"
                />
              </div>
              <span class="form-error" id="email-error" role="alert" aria-live="polite" hidden></span>
            </div>

            <button class="btn btn--primary btn--full" type="submit" id="reset-btn">
              Send Reset Link
            </button>
          </form>
        </div>

        <!-- Step 2: Success -->
        <div id="reset-success-wrapper" hidden>
          <div class="reset-success-icon" aria-hidden="true">✉️</div>
          <h2 class="auth-card__welcome">Check your email</h2>
          <p class="auth-card__hint" id="reset-success-msg">
            A password reset link has been sent. Check your inbox and follow the instructions.
          </p>
          <button class="btn btn--primary btn--full" id="resend-btn" type="button">
            Resend Email
          </button>
        </div>

        <p class="auth-register-row" style="margin-top: var(--space-5);">
          <a href="index.html" class="link">← Back to Sign In</a>
        </p>

      </div>
    </div>
  </main>

  <div id="loading-overlay" class="loading-overlay" hidden aria-hidden="true">
    <div class="spinner" role="status"><span class="sr-only">Loading…</span></div>
  </div>

  <script type="module" src="src/auth/forgot-password.js"></script>
</body>
</html>
