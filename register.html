<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Bacnotan BEE-Alert</title>
  <link rel="stylesheet" href="src/styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">

  <!-- Toast container (required by ui-helpers.js showToast) -->
  <div id="toast-container" aria-live="polite" aria-atomic="false"></div>

  <main class="auth-main auth-main--wide">
    <div class="auth-card">

      <!-- ── Gradient header ── -->
      <header class="auth-card__header">
        <div class="auth-card__logo" aria-hidden="true">🐝</div>
        <h1 class="auth-card__title">Bacnotan BEE-Alert</h1>
        <p class="auth-card__subtitle">Create your account</p>
      </header>

      <!-- ── Card body ── -->
      <div class="auth-card__body">
        <h2 class="auth-card__welcome">Create Account</h2>

        <form id="register-form" novalidate aria-label="Registration form">

          <!-- Full Name -->
          <div class="form-group">
            <label class="form-label" for="full-name">Full Name</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     focusable="false" aria-hidden="true">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                  <circle cx="12" cy="7" r="4"/>
                </svg>
              </span>
              <input
                class="form-input"
                type="text"
                id="full-name"
                name="full-name"
                placeholder="Juan dela Cruz"
                autocomplete="name"
                required
                aria-required="true"
                aria-describedby="full-name-error"
              />
            </div>
            <span
              class="form-error"
              id="full-name-error"
              role="alert"
              aria-live="polite"
              hidden
            ></span>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     focusable="false" aria-hidden="true">
                  <rect x="2" y="4" width="20" height="16" rx="2"/>
                  <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                </svg>
              </span>
              <input
                class="form-input"
                type="email"
                id="email"
                name="email"
                placeholder="juan@example.com"
                autocomplete="email"
                required
                aria-required="true"
                aria-describedby="email-error"
              />
            </div>
            <span
              class="form-error"
              id="email-error"
              role="alert"
              aria-live="polite"
              hidden
            ></span>
          </div>

          <!-- Phone Number -->
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     focusable="false" aria-hidden="true">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07
                           19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67
                           A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72
                           c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91
                           a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45
                           c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
              </span>
              <input
                class="form-input"
                type="tel"
                id="phone"
                name="phone"
                placeholder="09XXXXXXXXX"
                autocomplete="tel"
                required
                aria-required="true"
                aria-describedby="phone-error"
              />
            </div>
            <span
              class="form-error"
              id="phone-error"
              role="alert"
              aria-live="polite"
              hidden
            ></span>
          </div>

          <!-- Barangay -->
          <div class="form-group">
            <label class="form-label" for="barangay">Barangay</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     focusable="false" aria-hidden="true">
                  <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/>
                  <circle cx="12" cy="10" r="3"/>
                </svg>
              </span>
              <input
                class="form-input"
                type="text"
                id="barangay"
                name="barangay"
                placeholder="e.g. Poblacion"
                autocomplete="address-level3"
                required
                aria-required="true"
                aria-describedby="barangay-error"
              />
            </div>
            <span
              class="form-error"
              id="barangay-error"
              role="alert"
              aria-live="polite"
              hidden
            ></span>
          </div>

          <!-- Password -->
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     focusable="false" aria-hidden="true">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                class="form-input form-input--has-end-icon"
                type="password"
                id="password"
                name="password"
                placeholder="Minimum 8 characters"
                autocomplete="new-password"
                required
                aria-required="true"
                aria-describedby="password-error password-strength-hint"
              />
              <!-- Show/hide toggle -->
              <button
                class="input-end-btn"
                type="button"
                id="toggle-password"
                aria-label="Show password"
                aria-pressed="false"
              >
                <!-- Eye (hidden state) -->
                <svg id="eye-icon-password" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true" focusable="false">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <!-- Eye-off (visible state) -->
                <svg id="eye-off-icon-password" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true" focusable="false"
                     style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>

            <!-- Password strength indicator -->
            <div class="password-strength" id="password-strength" aria-live="polite">
              <div class="password-strength__bar">
                <div class="password-strength__fill" id="strength-fill"></div>
              </div>
              <span class="password-strength__label" id="password-strength-hint"></span>
            </div>

            <span
              class="form-error"
              id="password-error"
              role="alert"
              aria-live="polite"
              hidden
            ></span>
          </div>

          <!-- Confirm Password -->
          <div class="form-group">
            <label class="form-label" for="confirm-password">Confirm Password</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                     viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                     focusable="false" aria-hidden="true">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                class="form-input form-input--has-end-icon"
                type="password"
                id="confirm-password"
                name="confirm-password"
                placeholder="Re-enter your password"
                autocomplete="new-password"
                required
                aria-required="true"
                aria-describedby="confirm-password-error"
              />
              <!-- Show/hide toggle -->
              <button
                class="input-end-btn"
                type="button"
                id="toggle-confirm-password"
                aria-label="Show confirm password"
                aria-pressed="false"
              >
                <!-- Eye (hidden state) -->
                <svg id="eye-icon-confirm" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true" focusable="false">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <!-- Eye-off (visible state) -->
                <svg id="eye-off-icon-confirm" width="18" height="18" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"
                     aria-hidden="true" focusable="false"
                     style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
            <span
              class="form-error"
              id="confirm-password-error"
              role="alert"
              aria-live="polite"
              hidden
            ></span>
          </div>

          <!-- Auth-level error (e.g. email already in use) -->
          <div
            id="register-error"
            class="form-error form-error--block"
            role="alert"
            aria-live="polite"
            hidden
          ></div>

          <!-- Submit -->
          <button class="btn btn--primary btn--full" type="submit" id="register-btn">
            Create Account
          </button>

        </form><!-- /#register-form -->

        <!-- Back to login -->
        <p class="auth-register-row">
          Already have an account?
          <a class="link" href="/index.html">Sign In</a>
        </p>

      </div><!-- /.auth-card__body -->
    </div><!-- /.auth-card -->
  </main>

  <!-- Loading overlay -->
  <div id="loading-overlay" class="loading-overlay" hidden aria-hidden="true">
    <div class="spinner" role="status">
      <span class="sr-only">Loading…</span>
    </div>
  </div>

  <!-- Registration logic -->
  <script type="module" src="src/auth/register.js"></script>
</body>
</html>
