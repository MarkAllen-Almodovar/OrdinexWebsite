<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bacnotan BEE-Alert — Admin Sign In</title>
  <link rel="stylesheet" href="src/styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="auth-body">

  <!-- Toast container -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <main class="auth-main">
    <div class="auth-card">

      <!-- Gradient header -->
      <header class="auth-card__header">
        <div class="auth-card__logo" aria-hidden="true">🐝</div>
        <h1 class="auth-card__title">Bacnotan BEE-Alert</h1>
        <p class="auth-card__subtitle">Admin Portal</p>
      </header>

      <!-- Card body -->
      <div class="auth-card__body">
        <h2 class="auth-card__welcome">Admin Sign In</h2>
        <p class="auth-card__hint">Enter your registered phone number to receive a one-time password.</p>

        <!-- Auth-level error -->
        <div
          id="auth-error"
          class="form-error form-error--block"
          role="alert"
          aria-live="polite"
          hidden
        ></div>

        <!-- ── Step 1: Phone number form ── -->
        <form id="phone-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="phone-input">Phone Number</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"
                     focusable="false" aria-hidden="true">
                  <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07
                           19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67
                           A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72
                           c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91
                           a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45
                           c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>
                </svg>
              </span>
              <input
                class="form-input"
                type="tel"
                id="phone-input"
                name="phone"
                autocomplete="tel"
                placeholder="e.g. 09391034185"
                aria-describedby="phone-error"
                aria-required="true"
              />
            </div>
            <span class="form-error" id="phone-error" role="alert" aria-live="polite" hidden></span>
          </div>

          <!-- reCAPTCHA container (Firebase invisible reCAPTCHA mounts here) -->
          <div id="recaptcha-container"></div>

          <button class="btn btn--primary btn--full" type="submit" id="send-otp-btn">
            Send OTP
          </button>
        </form>

        <!-- ── Step 2: OTP verification form (hidden until OTP is sent) ── -->
        <form id="otp-form" novalidate hidden>
          <p class="otp-info" id="otp-info"></p>

          <div class="form-group">
            <label class="form-label" for="otp-input">One-Time Password</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round"
                     focusable="false" aria-hidden="true">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                  <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
              </span>
              <input
                class="form-input"
                type="text"
                id="otp-input"
                name="otp"
                autocomplete="one-time-code"
                inputmode="numeric"
                maxlength="6"
                placeholder="Enter 6-digit OTP"
                aria-describedby="otp-error"
                aria-required="true"
              />
            </div>
            <span class="form-error" id="otp-error" role="alert" aria-live="polite" hidden></span>
          </div>

          <button class="btn btn--primary btn--full" type="submit" id="verify-otp-btn">
            Verify &amp; Sign In
          </button>

          <button class="btn--text-link" type="button" id="change-phone-btn">
            ← Use a different number
          </button>
        </form>

      </div><!-- /.auth-card__body -->
    </div><!-- /.auth-card -->
  </main>

  <!-- Loading overlay -->
  <div id="loading-overlay" class="loading-overlay" hidden aria-hidden="true">
    <div class="spinner" role="status">
      <span class="sr-only">Loading…</span>
    </div>
  </div>

  <script type="module" src="src/auth/login.js"></script>
</body>
</html>
