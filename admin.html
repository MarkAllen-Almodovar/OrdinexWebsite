<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bacnotan BEE-Alert — Admin</title>
  <link rel="stylesheet" href="src/styles/main.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="admin-page">

  <!-- Toast container for notifications -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- Sidebar overlay backdrop (mobile only) -->
  <div id="sidebar-overlay" class="sidebar-overlay" aria-hidden="true"></div>

  <div class="admin-layout">

    <!-- ── Sidebar ── -->
    <aside class="admin-sidebar" id="admin-sidebar">

      <div class="admin-sidebar__brand">
        <span class="admin-sidebar__logo" aria-hidden="true">🐝</span>
        <span class="admin-sidebar__title">BEE-Alert</span>
      </div>

      <nav class="admin-nav" aria-label="Admin navigation">

        <a
          class="admin-nav__link is-active"
          data-section="dashboard"
          href="#"
          role="button"
          id="nav-dashboard"
          aria-current="page"
        >
          <!-- Bar chart icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <line x1="18" y1="20" x2="18" y2="10"/>
            <line x1="12" y1="20" x2="12" y2="4"/>
            <line x1="6" y1="20" x2="6" y2="14"/>
          </svg>
          Dashboard
        </a>

        <a
          class="admin-nav__link"
          data-section="concern-management"
          href="#"
          role="button"
          id="nav-concern-management"
        >
          <!-- Clipboard list icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"/>
            <line x1="9" y1="12" x2="15" y2="12"/>
            <line x1="9" y1="16" x2="13" y2="16"/>
          </svg>
          Community Concerns
        </a>

        <a
          class="admin-nav__link"
          data-section="settings"
          href="#"
          role="button"
          id="nav-settings"
        >
          <!-- Settings / gear icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
          Settings
        </a>

      </nav>

      <div class="admin-sidebar__footer">
        <button class="admin-signout-btn" type="button" id="sign-out-btn">
          <!-- Log-out icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Sign Out
        </button>
      </div>

    </aside>
    <!-- /.admin-sidebar -->

    <!-- ── Main content wrapper ── -->
    <div class="admin-main-wrapper">

      <!-- Mobile header with hamburger -->
      <header class="admin-mobile-header">
        <button
          id="menu-toggle"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="admin-sidebar"
        >
          <!-- Hamburger icon -->
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true" focusable="false">
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>
        <span class="admin-mobile-header__title">🐝 BEE-Alert Admin</span>
      </header>

      <main class="admin-main" id="admin-content">

        <section
          class="admin-section is-active"
          id="section-dashboard"
          aria-label="Dashboard"
        ></section>

        <section
          class="admin-section"
          id="section-concern-management"
          aria-label="Community Concern Management"
        ></section>

        <section
          class="admin-section"
          id="section-settings"
          aria-label="Settings"
        ></section>

      </main>

    </div>
    <!-- /.admin-main-wrapper -->

  </div>
  <!-- /.admin-layout -->

  <!-- Loading overlay -->
  <div id="loading-overlay" class="loading-overlay" hidden aria-hidden="true">
    <div class="spinner" role="status">
      <span class="sr-only">Loading…</span>
    </div>
  </div>

  <script type="module" src="src/admin/app.js"></script>
</body>
</html>
